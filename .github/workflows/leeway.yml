name: LEEWAY Standards

on:
  push:
    branches: ["main","master"]
  pull_request:
    branches: ["main","master"]

jobs:
  leeway-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: |
          npm install
      - name: Run leeway fix
        run: |
          node scripts/leeway-fix.mjs
      - name: Run leeway CI
        run: |
          node scripts/leeway-ci.mjs
