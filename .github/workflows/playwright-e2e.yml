name: Playwright E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "ci/*"]

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PORT: 6001
      WS_PORT: 6003
      NEURAL_ROUTER_PORT: 6004
      DESKTOP_AGENT_PORT: 6005
      VITE_API_BASE: http://localhost:6000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: tsc --build backend/tsconfig.json

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          echo "Running Playwright (CI) with ports: $PORT $WS_PORT $NEURAL_ROUTER_PORT"
          npx playwright test --reporter=dot,html
        env:
          CI: true
          PORT: ${{ env.PORT }}
          WS_PORT: ${{ env.WS_PORT }}
          NEURAL_ROUTER_PORT: ${{ env.NEURAL_ROUTER_PORT }}
          DESKTOP_AGENT_PORT: ${{ env.DESKTOP_AGENT_PORT }}
          VITE_API_BASE: ${{ env.VITE_API_BASE }}

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/reports

      - name: Upload Playwright test-results
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
