model_id: qwen3-0.6b-instruct
task_type: mcp-agent
metadata:
  name: qwen3-health-mcp
  owner: agent-lee
  created_by: automation
  created_at: 2026-03-01
deployment_config:
  instance_type: ecs.gn6v-c8g1.2xlarge
  min_replicas: 1
  max_replicas: 3
  autoscale: true
  readiness_probe:
    path: /health
    port: 8080
agent_context:
  system_prompt: |
    You are the Agent Lee Health Monitor MCP.
    Your law is to analyze system metrics (CPU, RAM, Disk, Docker) and report anomalies.
    You have read-only access to metrics; you MUST NOT modify or delete files.
    For alerts: if average latency > 200ms or CPU > 92% sustained, emit a `Degraded` status.
    Tag all observations with `source`, `metric`, `value`, `timestamp`.
tools_enabled:
  - psutil_health_check
  - docker_container_inspect
  - metrics_exporter
env:
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
  AGENT_ID: qwen3-health-mcp
