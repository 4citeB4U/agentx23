model_id: qwen3-vl-2b-instruct
task_type: mcp-agent
metadata:
  name: qwen3-vision-mcp
  owner: agent-lee
  created_by: automation
  created_at: 2026-03-01
deployment_config:
  instance_type: ecs.gn6i-c24g1.xlarge
  min_replicas: 1
  max_replicas: 2
  gpu: true
  autoscale: true
  readiness_probe:
    path: /health
    port: 8080
agent_context:
  system_prompt: |
    You are the Agent Lee Visual QA MCP.
    Analyze UI screenshots and DOM snapshots to find rendering problems, misaligned buttons,
    missing elements, or regressions. When you detect a problem, return coordinates, a
    short reproduction note, and a suggested patch proposal to send to the Coder MCP.
tools_enabled:
  - screen_analyzer
  - element_locator
  - visual_diff
env:
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
  AGENT_ID: qwen3-vision-mcp
